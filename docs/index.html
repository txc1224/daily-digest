<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotBoard - 全网热榜聚合</title>
    <style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    /* Dark tech palette */
    --bg: #07080d;
    --bg-soft: #0b0d15;
    --surface: rgba(255, 255, 255, 0.045);
    --surface-strong: rgba(255, 255, 255, 0.08);
    --surface-solid: #10131d;
    --card-bg: rgba(255, 255, 255, 0.05);
    --text: #eef1f8;
    --text-secondary: #98a1b3;
    --text-faint: #6b7488;
    --accent: #ff7a45;
    --border: rgba(255, 255, 255, 0.09);
    --border-strong: rgba(255, 255, 255, 0.16);
    --shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
    --shadow-strong: 0 28px 72px rgba(0, 0, 0, 0.55);
    --radius: 22px;
    --blue: #4da3ff;
    --green: #3ddc97;
    --teal: #2dd4bf;
    --cyan: #22d3ee;
    --violet: #a78bfa;
    --orange: #ffb020;
    --red: #ff5d5d;
    --pink: #f472b6;
    --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --font-num: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
}

html { color-scheme: dark; }

body {
    font-family: var(--font-sans);
    background:
        radial-gradient(52% 42% at 12% -4%, rgba(255, 122, 69, 0.14), transparent 62%),
        radial-gradient(48% 40% at 88% 0%, rgba(34, 211, 238, 0.12), transparent 60%),
        radial-gradient(60% 50% at 50% 110%, rgba(167, 139, 250, 0.10), transparent 64%),
        linear-gradient(180deg, #08090f 0%, #07080d 40%, #06070b 100%);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    position: relative;
    -webkit-font-smoothing: antialiased;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: 34px 34px;
    mask-image: radial-gradient(ellipse 90% 60% at 50% 0%, rgba(0, 0, 0, 0.5), transparent 78%);
    opacity: 0.5;
}

::selection { background: rgba(255, 122, 69, 0.32); }

a { color: inherit; }

/* ---------- Header ---------- */
header {
    background: rgba(8, 10, 16, 0.72);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-inner {
    max-width: 1440px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.brand { display: flex; align-items: baseline; gap: 10px; }

header h1 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(120deg, #fff 30%, #ffd7c2 70%, #ff7a45);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.live-dot {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--green);
    font-weight: 600;
    letter-spacing: 0.04em;
}
.live-dot::before {
    content: "";
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
    animation: pulse 2.2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.82); } }

.subtitle { color: var(--text-secondary); font-size: 13px; }

.header-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.search-box {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    width: 190px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    font-family: var(--font-sans);
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
}
.search-box::placeholder { color: var(--text-faint); }
.search-box:focus {
    border-color: rgba(255, 122, 69, 0.5);
    background: var(--surface-strong);
    box-shadow: 0 0 0 4px rgba(255, 122, 69, 0.12);
}

.filter-btn {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 12px;
    cursor: pointer;
    background: var(--surface);
    color: var(--text-secondary);
    font-family: var(--font-sans);
    transition: all 0.2s;
}
.filter-btn:hover { border-color: var(--border-strong); color: var(--text); }
.filter-btn.active { background: var(--text); color: #0a0b10; border-color: var(--text); font-weight: 600; }

.history-select, .update-time {
    font-size: 12px;
    color: var(--text-secondary);
    font-family: var(--font-num);
}

.history-select {
    padding: 7px 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    font-family: var(--font-sans);
}
.history-select:focus { outline: none; border-color: var(--border-strong); }

/* ---------- Main ---------- */
main {
    max-width: 1440px;
    margin: 0 auto;
    padding: 24px 24px 48px;
}

/* ---------- Glass panel base ---------- */
.glass {
    background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.028));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
}

/* ---------- Filter panel ---------- */
.filter-panel {
    max-width: 1440px;
    margin: 14px auto 0;
    padding: 0 24px;
    display: none;
}
.filter-panel.show { display: block; }
.filter-panel-inner {
    padding: 14px 16px;
}
.filter-panel h3 { font-size: 12px; margin-bottom: 10px; color: var(--text-secondary); font-weight: 600; letter-spacing: 0.04em; }

.platform-toggles { display: flex; flex-wrap: wrap; gap: 6px; }

.platform-toggle {
    padding: 5px 11px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    background: var(--surface);
    color: var(--text);
    transition: all 0.15s;
    user-select: none;
}
.platform-toggle:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.platform-toggle.hidden { opacity: 0.35; text-decoration: line-through; }

/* ---------- HERO / focal ---------- */
.hero {
    position: relative;
    overflow: hidden;
    border-radius: 30px;
    border: 1px solid var(--border-strong);
    background:
        radial-gradient(80% 120% at 8% 0%, rgba(255, 122, 69, 0.18), transparent 55%),
        radial-gradient(70% 120% at 95% 10%, rgba(34, 211, 238, 0.16), transparent 55%),
        radial-gradient(60% 90% at 60% 110%, rgba(167, 139, 250, 0.14), transparent 60%),
        linear-gradient(160deg, #12141f 0%, #0b0d16 100%);
    box-shadow: var(--shadow-strong);
    padding: 30px 30px 24px;
    margin-bottom: 22px;
}
.hero::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 30px 30px;
    mask-image: radial-gradient(ellipse 80% 90% at 30% 0%, rgba(0,0,0,0.5), transparent 75%);
    pointer-events: none;
}
.hero-top { position: relative; z-index: 1; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.hero-kicker {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: #ffc9ab; font-weight: 700; margin-bottom: 14px;
}
.hero-kicker::before { content: ""; width: 26px; height: 1px; background: linear-gradient(90deg, var(--accent), transparent); }
.hero-title {
    font-size: clamp(30px, 4.6vw, 50px);
    line-height: 1.02;
    font-weight: 800;
    letter-spacing: -0.045em;
    max-width: 16ch;
    background: linear-gradient(120deg, #ffffff 20%, #ffe3d3 55%, #ffb08a 90%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.hero-sub { color: var(--text-secondary); font-size: 14px; max-width: 52ch; margin-top: 12px; }

.hero-metrics { display: flex; gap: 12px; flex-wrap: wrap; }
.hud {
    min-width: 118px;
    padding: 14px 16px;
    border-radius: 18px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    backdrop-filter: blur(8px);
}
.hud-label { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); margin-bottom: 8px; letter-spacing: 0.04em; }
.hud-dot { width: 6px; height: 6px; border-radius: 50%; }
.hud-value { font-family: var(--font-num); font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.hud.good .hud-value { color: var(--green); } .hud.good .hud-dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
.hud.warn .hud-value { color: var(--red); } .hud.warn .hud-dot { background: var(--red); box-shadow: 0 0 8px var(--red); }
.hud.idle .hud-value { color: var(--orange); } .hud.idle .hud-dot { background: var(--orange); box-shadow: 0 0 8px var(--orange); }

/* cross-platform topics inside hero */
.hero-topics { position: relative; z-index: 1; margin-top: 22px; }
.hero-topics-label { font-size: 12px; color: var(--text-secondary); font-weight: 600; letter-spacing: 0.06em; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.topic-cards { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.topic-cards::-webkit-scrollbar { height: 4px; }
.topic-cards::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

.topic-card {
    position: relative;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 14px 16px;
    min-width: 264px;
    max-width: 264px;
    flex-shrink: 0;
    transition: transform 240ms var(--ease-out-quart), border-color 200ms ease, background 200ms ease;
}
.topic-card:hover { transform: translateY(-3px); border-color: var(--border-strong); background: rgba(255,255,255,0.09); }
.topic-card .topic-name { font-size: 15px; font-weight: 700; margin-bottom: 5px; letter-spacing: -0.01em; }
.topic-card .topic-summary {
    font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.topic-platforms { display: flex; gap: 4px; flex-wrap: wrap; }
.topic-platform-tag {
    font-size: 10px; padding: 3px 7px; border-radius: 6px;
    background: rgba(255,255,255,0.1); color: var(--text-secondary); font-weight: 600;
}
.heat-bar { height: 4px; background: rgba(255,255,255,0.12); border-radius: 3px; margin-top: 12px; overflow: hidden; }
.heat-bar-fill {
    height: 100%; border-radius: 3px; width: 0;
    background: linear-gradient(90deg, var(--orange), var(--accent), var(--pink));
    box-shadow: 0 0 12px rgba(255, 122, 69, 0.6);
    transition: width 900ms var(--ease-out-expo);
}

/* ---------- Rising ticker ---------- */
.rising-section { margin-bottom: 22px; overflow: hidden; }
.rising-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 0; }
.rising-head h2 { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.rising-head .flame { filter: drop-shadow(0 0 8px rgba(255,122,69,0.8)); }
.rising-viewport { overflow: hidden; padding: 12px 0 14px; mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
.rising-track { display: flex; gap: 10px; width: max-content; animation: ticker 46s linear infinite; }
.rising-viewport:hover .rising-track { animation-play-state: paused; }
@keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }

.rising-item {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 12px; white-space: nowrap; flex-shrink: 0;
    color: var(--text); text-decoration: none;
    transition: border-color 0.2s, background 0.2s, transform 0.2s;
}
.rising-item:hover { border-color: rgba(255,122,69,0.5); background: var(--surface-strong); transform: translateY(-1px); }
.rising-badge { font-size: 10px; padding: 2px 6px; border-radius: 5px; font-weight: 800; letter-spacing: 0.02em; }
.rising-badge.new { background: linear-gradient(135deg, #ff5d5d, #ff8a3d); color: #fff; box-shadow: 0 0 10px rgba(255,93,93,0.5); }
.rising-badge.up { background: rgba(61,220,151,0.18); color: var(--green); border: 1px solid rgba(61,220,151,0.3); }
.rising-item .src { color: var(--text-faint); font-size: 10px; }

/* ---------- Section headers ---------- */
.status-section, .trend-section { padding: 18px; margin-bottom: 0; }
.status-section { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: none; }
.trend-section { border-top-left-radius: 0; border-top-right-radius: 0; border-top: 1px solid var(--border); }

/* ---------- Collapsible diagnostics ---------- */
.diag-section { margin-bottom: 22px; overflow: hidden; }
.diag-header {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 15px 18px;
    background: none; border: none; cursor: pointer; text-align: left;
    color: var(--text); font-family: var(--font-sans);
    transition: background 0.2s;
}
.diag-header:hover { background: rgba(255,255,255,0.03); }
.diag-title { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 9px; }
.diag-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.diag-dot.good { background: var(--green); box-shadow: 0 0 8px var(--green); }
.diag-dot.warn { background: var(--orange); box-shadow: 0 0 8px var(--orange); }
.diag-dot.bad { background: var(--red); box-shadow: 0 0 8px var(--red); animation: pulse 2.2s ease-in-out infinite; }
.diag-summary { font-size: 12px; color: var(--text-secondary); font-family: var(--font-num); }
.diag-chev { margin-left: auto; color: var(--text-faint); font-size: 12px; transition: transform 0.25s; }
.diag-section.open .diag-chev { transform: rotate(180deg); }
.diag-body { display: none; padding: 0 14px 14px; }
.diag-section.open .diag-body { display: block; animation: fade-in 320ms ease both; }

.section-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.section-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.section-subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }

.health-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.health-card { border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; background: var(--surface); }
.health-card.warning { background: rgba(255,93,93,0.08); border-color: rgba(255,93,93,0.28); }
.health-label { display: block; font-size: 11px; color: var(--text-secondary); margin-bottom: 8px; letter-spacing: 0.04em; }
.health-value { font-family: var(--font-num); font-size: 26px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }

.health-history { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.health-history-item { min-width: 92px; padding: 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); flex-shrink: 0; }
.history-time { display: block; font-size: 10px; color: var(--text-secondary); margin-bottom: 5px; font-family: var(--font-num); }
.history-health { display: flex; gap: 8px; font-size: 12px; font-family: var(--font-num); }
.history-health strong { color: var(--green); }
.history-health em { color: var(--red); font-style: normal; }

/* ---------- Platform trend cards ---------- */
.platform-trend-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(264px, 1fr)); gap: 12px; }
.platform-trend-card { border: 1px solid var(--border); border-radius: 16px; padding: 14px; background: var(--surface); }
.platform-trend-card.state-failing { border-color: rgba(255,93,93,0.32); background: rgba(255,93,93,0.07); }
.platform-trend-card.state-stale { border-color: rgba(255,176,32,0.32); background: rgba(255,176,32,0.06); }
.platform-trend-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.platform-name { font-size: 14px; font-weight: 700; }

.status-pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 9px; font-size: 10px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; }
.status-healthy { background: rgba(61,220,151,0.16); color: var(--green); border: 1px solid rgba(61,220,151,0.28); }
.status-stale { background: rgba(255,176,32,0.16); color: var(--orange); border: 1px solid rgba(255,176,32,0.28); }
.status-failing { background: rgba(255,93,93,0.16); color: var(--red); border: 1px solid rgba(255,93,93,0.3); }

.platform-metrics { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.metric-pill { font-size: 10px; color: var(--text-secondary); background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 999px; padding: 4px 8px; font-family: var(--font-num); }

.sparkline { display: flex; gap: 4px; margin-bottom: 10px; }
.spark { height: 8px; flex: 1; border-radius: 999px; background: rgba(255,255,255,0.1); }
.spark.healthy { background: var(--green); box-shadow: 0 0 6px rgba(61,220,151,0.5); }
.spark.stale { background: var(--orange); }
.spark.failing { background: var(--red); }
.platform-error { font-size: 11px; color: var(--text-secondary); line-height: 1.45; }

/* ---------- Group ---------- */
.group-section { margin-bottom: 28px; }
.group-title {
    font-size: 17px; font-weight: 800; letter-spacing: -0.02em;
    margin-bottom: 16px; padding-left: 4px; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 10px;
}
.group-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-strong), transparent); }
.group-title .chev { margin-left: auto; color: var(--text-faint); font-size: 12px; transition: transform 0.25s; }
.group-title.collapsed .chev { transform: rotate(-90deg); }

.boards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; perspective: 1400px; align-items: start; }
.boards-grid.collapsed { display: none; }

/* ---------- Card (glass) ---------- */
.board-card {
    --card-accent: #ff7a45;
    --card-accent-soft: rgba(255, 122, 69, 0.14);
    --pointer-x: 50%;
    --pointer-y: 25%;
    --tilt-x: 0deg;
    --tilt-y: 0deg;
    background: linear-gradient(165deg, rgba(255,255,255,0.075), rgba(255,255,255,0.03));
    border-radius: 24px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: box-shadow 280ms var(--ease-out-quart), transform 280ms var(--ease-out-quart), border-color 240ms ease;
    position: relative;
    border: 1px solid var(--border);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    transform: perspective(1400px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) translate3d(0, 0, 0);
    transform-style: preserve-3d;
    animation: card-enter 640ms var(--ease-out-expo) both;
    animation-delay: calc(var(--card-index, 0) * 34ms);
    display: flex;
    flex-direction: column;
}
.board-card::before, .board-card::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
.board-card::before {
    background:
        radial-gradient(circle at var(--pointer-x) var(--pointer-y), rgba(255,255,255,0.16), transparent 38%),
        linear-gradient(180deg, rgba(255,255,255,0.05), transparent 30%);
    opacity: 0;
    transition: opacity 280ms ease;
    z-index: 2;
}
.board-card::after {
    inset: 0 0 auto; height: 3px;
    background: linear-gradient(90deg, var(--card-accent), transparent 80%);
    box-shadow: 0 0 16px var(--card-accent);
    opacity: 0.9;
}
.board-card[data-group="tech"] { --card-accent: #2dd4bf; --card-accent-soft: rgba(45, 212, 191, 0.14); }
.board-card[data-group="overseas"] { --card-accent: #4da3ff; --card-accent-soft: rgba(77, 163, 255, 0.14); }
.board-card[data-group="domestic"] { --card-accent: #ff7a45; --card-accent-soft: rgba(255, 122, 69, 0.14); }
.board-card[data-group="seo"] { --card-accent: #a78bfa; --card-accent-soft: rgba(167, 139, 250, 0.14); }
.board-card[data-state="failing"] { --card-accent: #ff5d5d; --card-accent-soft: rgba(255,93,93,0.14); }
.board-card[data-state="stale"] { --card-accent: #ffb020; --card-accent-soft: rgba(255,176,32,0.14); }

.board-card:hover { box-shadow: var(--shadow-strong); border-color: color-mix(in srgb, var(--card-accent) 40%, var(--border)); }
.board-card:hover::before, .board-card:focus-within::before { opacity: 1; }
.board-card.hidden-platform { display: none; }

.card-header { display: flex; align-items: center; padding: 16px 16px 0; gap: 11px; position: relative; z-index: 1; }
.card-icon {
    width: 40px; height: 40px; font-size: 18px; border-radius: 13px;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    background: linear-gradient(160deg, rgba(255,255,255,0.12), var(--card-accent-soft));
    border: 1px solid var(--border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
}
.card-title { font-size: 15px; font-weight: 700; flex: 1; letter-spacing: -0.02em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-link {
    color: var(--text-secondary); text-decoration: none; font-size: 14px;
    min-width: 34px; min-height: 34px; display: inline-flex; align-items: center; justify-content: center;
    padding: 2px 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border);
    transition: all 0.2s; flex-shrink: 0;
}
.card-link:hover { background: var(--card-accent-soft); color: var(--text); transform: translateY(-1px); border-color: color-mix(in srgb, var(--card-accent) 40%, var(--border)); }

.card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 10px; color: var(--text-secondary); padding: 8px 16px 10px; position: relative; z-index: 1; }
.card-meta .time { font-family: var(--font-num); color: var(--text-faint); }

.card-toolbar { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 12px; position: relative; z-index: 1; }
.toolbar-pill { font-size: 10px; color: var(--text-secondary); background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 999px; padding: 4px 8px; font-family: var(--font-num); white-space: nowrap; }

/* ---------- Card cover (featured) ---------- */
.card-cover {
    margin: 0 16px 12px; padding: 16px; border-radius: 18px; position: relative; z-index: 1; overflow: hidden;
    background:
        radial-gradient(circle at top right, color-mix(in srgb, var(--card-accent) 26%, transparent), transparent 55%),
        linear-gradient(150deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
    border: 1px solid color-mix(in srgb, var(--card-accent) 26%, var(--border));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
}
.card-cover::before {
    content: ""; position: absolute; inset: auto -18% -30% auto; width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--card-accent) 30%, transparent), transparent 68%);
    pointer-events: none;
}
.card-cover-github {
    background:
        radial-gradient(circle at top right, rgba(61,220,151,0.16), transparent 50%),
        linear-gradient(150deg, #101a15 0%, #0b120e 100%);
    border-color: rgba(61,220,151,0.22);
}
.cover-kicker { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 11px; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: color-mix(in srgb, var(--card-accent) 80%, #fff); font-weight: 700; }
.cover-kicker::before { content: ""; width: 22px; height: 1px; background: color-mix(in srgb, var(--card-accent) 70%, transparent); }

.cover-title {
    position: relative; z-index: 1; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    color: var(--text); text-decoration: none;
    font-size: 19px; line-height: 1.22; font-weight: 700; letter-spacing: -0.025em;
    margin-bottom: 12px; overflow-wrap: anywhere;
    transition: color 0.2s;
}
.cover-title:hover { color: color-mix(in srgb, var(--card-accent) 70%, #fff); }

.cover-meta-row { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.cover-pill {
    display: inline-flex; align-items: center; min-height: 24px; padding: 4px 9px; border-radius: 999px;
    font-size: 10px; letter-spacing: 0.04em; font-weight: 600;
    color: color-mix(in srgb, var(--card-accent) 70%, #fff);
    background: rgba(255,255,255,0.08); border: 1px solid color-mix(in srgb, var(--card-accent) 24%, var(--border));
    font-family: var(--font-num); white-space: nowrap;
}
.cover-summary {
    position: relative; z-index: 1; color: var(--text-secondary); font-size: 12px; line-height: 1.5; margin-top: 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere;
}
.card-cover-github .cover-summary { color: rgba(213, 230, 220, 0.7); }

.cover-github-grid { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(150px, 0.85fr); gap: 14px; align-items: start; }
.cover-github-main { min-width: 0; }
.cover-rail { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.cover-rail-item {
    display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 9px; align-items: start; text-decoration: none;
    padding: 8px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    transition: transform 220ms var(--ease-out-quart), border-color 160ms ease, background 160ms ease;
}
.cover-rail-item:hover { transform: translateX(3px); background: rgba(255,255,255,0.09); border-color: rgba(61,220,151,0.3); }
.cover-rail-rank { display: inline-flex; align-items: center; justify-content: center; min-height: 22px; border-radius: 999px; font-size: 9px; font-weight: 800; letter-spacing: 0.04em; color: rgba(61,220,151,0.9); background: rgba(61,220,151,0.12); font-family: var(--font-num); }
.cover-rail-title { color: rgba(240,246,242,0.92); font-size: 12px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

.card-alert { margin: 0 14px 12px; padding: 9px 11px; border-radius: 12px; background: rgba(255,93,93,0.1); border: 1px solid rgba(255,93,93,0.24); color: #ff9c9c; font-size: 11px; line-height: 1.45; position: relative; z-index: 1; overflow-wrap: anywhere; }

/* ---------- Hot list ---------- */
.hot-list { list-style: none; padding: 0 12px 6px; position: relative; z-index: 1; display: flex; flex-direction: column; }
.hot-item {
    display: grid; grid-template-columns: 26px 16px minmax(0, 1fr) auto; align-items: center;
    padding: 8px 8px; border-radius: 12px; gap: 8px;
    transition: background 160ms ease, transform 200ms var(--ease-out-quart), border-color 160ms ease;
    border: 1px solid transparent;
}
.hot-item:hover { background: rgba(255,255,255,0.06); transform: translate3d(3px, 0, 0); border-color: color-mix(in srgb, var(--card-accent) 22%, var(--border)); }
.hot-item.search-hidden { display: none; }
.hot-item.is-extra { display: none; }
.board-card.expanded .hot-item.is-extra { display: grid; animation: fade-in 320ms ease both; }
@keyframes fade-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.item-rank {
    width: 25px; height: 25px; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: var(--text-secondary); flex-shrink: 0; border-radius: 8px;
    background: rgba(255,255,255,0.06); border: 1px solid var(--border); font-family: var(--font-num);
}
.top-1 .item-rank { background: linear-gradient(135deg, #ff5d5d, #ff8a3d); color: #fff; border-color: transparent; box-shadow: 0 0 12px rgba(255,93,93,0.5); }
.top-2 .item-rank { background: linear-gradient(135deg, #ff9500, #ffb020); color: #fff; border-color: transparent; }
.top-3 .item-rank { background: linear-gradient(135deg, #ffcc00, #ffd60a); color: #1d1d1f; border-color: transparent; }

.item-trend { font-size: 9px; flex-shrink: 0; width: 16px; text-align: center; font-weight: 800; font-family: var(--font-num); }
.trend-new { color: var(--red); }
.trend-up { color: var(--green); }
.trend-down { color: var(--text-faint); }

.item-title {
    font-size: 13px; color: var(--text); text-decoration: none; line-height: 1.35; min-width: 0;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
    text-overflow: ellipsis; overflow-wrap: anywhere;
    transition: color 0.15s;
}
.board-card.expanded .item-title { -webkit-line-clamp: 2; white-space: normal; }
.item-title:hover { color: color-mix(in srgb, var(--card-accent) 75%, #fff); }

.item-hot {
    font-size: 10px; color: var(--text-secondary); flex-shrink: 0; white-space: nowrap; border-radius: 999px;
    padding: 4px 7px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); font-family: var(--font-num);
    max-width: 84px; overflow: hidden; text-overflow: ellipsis;
}

.list-toggle {
    margin: 4px 16px 14px; padding: 9px 12px; border-radius: 12px;
    background: var(--surface); border: 1px dashed var(--border-strong);
    color: var(--text-secondary); font-size: 12px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: all 0.2s; font-family: var(--font-sans); position: relative; z-index: 1;
}
.list-toggle:hover { background: var(--card-accent-soft); color: var(--text); border-color: color-mix(in srgb, var(--card-accent) 45%, var(--border)); }
.list-toggle .chev { transition: transform 0.25s; font-size: 11px; }
.board-card.expanded .list-toggle .chev { transform: rotate(180deg); }

@keyframes card-enter {
    from { opacity: 0; transform: translate3d(0, 20px, 0) scale(0.98); }
    to { opacity: 1; transform: perspective(1400px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) translate3d(0, 0, 0) scale(1); }
}

footer { text-align: center; padding: 28px 20px; color: var(--text-faint); font-size: 11px; }
footer a { color: var(--text-secondary); text-decoration: none; }
footer a:hover { color: var(--text); }

.loading-state, .error-state { text-align: center; padding: 70px 24px; color: var(--text-secondary); }
.loading-state h2, .error-state h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }

/* ---------- Responsive ---------- */
@media (max-width: 860px) {
    main { padding: 16px 14px 40px; }
    header { padding: 12px 16px; }
    .boards-grid { grid-template-columns: 1fr; }
    .subtitle { display: none; }
    .search-box { width: 130px; }
    .hero { padding: 22px 18px 18px; border-radius: 24px; }
    .hero-title { max-width: none; }
    .hero-top { flex-direction: column; align-items: flex-start; }
    .topic-card { min-width: 230px; max-width: 230px; }
    .health-grid, .platform-trend-list { grid-template-columns: 1fr; }
    .board-card, .board-card:hover, .hot-item:hover { transform: none; }
    .cover-github-grid { grid-template-columns: 1fr; }
    .cover-rail { display: none; }
    .hud { min-width: 100px; flex: 1; }
}
@media (min-width: 1280px) {
    .boards-grid { grid-template-columns: repeat(4, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
    }
    .rising-track { animation: none; flex-wrap: wrap; width: auto; }
    .board-card { transform: none !important; }
}

</head>
<body>
    <header>
        <div class="header-inner">
            <div class="brand">
                <h1>HotBoard</h1>
                <span class="live-dot">LIVE</span>
            </div>
            <p class="subtitle">全网热榜实时聚合</p>
            <div class="header-actions">
                <input type="text" id="search-input" class="search-box" placeholder="搜索热榜..." oninput="onSearch(this.value)">
                <button class="filter-btn" onclick="toggleFilterPanel()">筛选</button>
                <select id="history-select" class="history-select" onchange="onHistoryChange(this.value)">
                    <option value="">最新</option>
                </select>
                <span id="update-time" class="update-time"></span>
            </div>
        </div>
    </header>

    <div id="filter-panel" class="filter-panel"><div class="filter-panel-inner glass" id="filter-panel-body"></div></div>

    <main id="main-content">
        <div class="loading-state"><h2>加载中…</h2></div>
    </main>

    <footer>
        <p>数据由 GitHub Actions 自动更新 · <a href="https://github.com/txc1224/daily-digest" style="color:var(--text-secondary)">HotBoard</a></p>
    </footer>

<script>
let currentData = null;
let hiddenPlatforms = JSON.parse(localStorage.getItem('hb_hidden') || '[]');
const VISIBLE_COUNT = 8;

function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }

function trendHtml(item) {
    if (!item.trend || item.trend === 'same') return '';
    if (item.trend === 'new') return '<span class="item-trend trend-new">NEW</span>';
    if (item.trend === 'up') return `<span class="item-trend trend-up">${item.rank_change > 0 ? '↑'+item.rank_change : '↑'}</span>`;
    if (item.trend === 'down') return '<span class="item-trend trend-down">↓</span>';
    return '';
}

function stateLabel(state) {
    if (state === 'failing') return '异常';
    if (state === 'stale') return '过期';
    return '正常';
}

/* 顶部焦点区:跨平台热点 + 平台健康 HUD */
function renderHero(health, analysis) {
    const topics = (analysis || {}).cross_platform_topics || [];
    const h = health || {};
    const hud = `
        <div class="hero-metrics">
            <div class="hud good"><span class="hud-label"><span class="hud-dot"></span>健康平台</span><div class="hud-value">${h.healthy_count || 0}<span style="font-size:15px;color:var(--text-faint)">/${h.enabled_count || 0}</span></div></div>
            <div class="hud warn"><span class="hud-label"><span class="hud-dot"></span>异常平台</span><div class="hud-value">${h.failing_count || 0}</div></div>
            <div class="hud idle"><span class="hud-label"><span class="hud-dot"></span>缓存过旧</span><div class="hud-value">${h.stale_count || 0}</div></div>
        </div>`;
    const topicsHtml = topics.length ? `
        <div class="hero-topics">
            <div class="hero-topics-label">🔥 跨平台热点 · 同一话题正在多个平台发酵</div>
            <div class="topic-cards">${topics.map(t => `
                <div class="topic-card">
                    <div class="topic-name">${escapeHtml(t.topic)}</div>
                    <div class="topic-summary">${escapeHtml(t.summary)}</div>
                    <div class="topic-platforms">${(t.platforms || []).map(p => `<span class="topic-platform-tag">${escapeHtml(p)}</span>`).join('')}</div>
                    <div class="heat-bar"><div class="heat-bar-fill" data-heat="${t.heat_score || 0}"></div></div>
                </div>`).join('')}
            </div>
        </div>` : '';
    return `<section class="hero">
        <div class="hero-top">
            <div class="hero-copy">
                <div class="hero-kicker">Signal Monitor · 全网热榜聚合</div>
                <h2 class="hero-title">一眼看穿，今天全网在沸腾什么。</h2>
                <p class="hero-sub">跨平台热点、技术社区精选与抓取健康状态，全部汇到同一块屏上。</p>
            </div>
            ${hud}
        </div>
        ${topicsHtml}
    </section>`;
}

/* 飙升热点无缝跑马灯(内容复制两份实现无缝滚动) */
function renderRising(rising) {
    if (!rising || !rising.length) return '';
    const item = (r) => {
        const badge = r.trend === 'new'
            ? '<span class="rising-badge new">NEW</span>'
            : `<span class="rising-badge up">↑${r.rank_change || ''}</span>`;
        return `<a class="rising-item" href="${escapeHtml(r.url || '#')}" target="_blank" rel="noopener">${badge}<span>${escapeHtml(r.title)}</span><span class="src">${escapeHtml(r.platform_name || r.platform || '')}</span></a>`;
    };
    const half = rising.map(item).join('');
    return `<div class="rising-section glass">
        <div class="rising-head"><h2><span class="flame">⚡</span>飙升热点</h2><span class="section-subtitle">正在快速攀升的话题 · 悬停暂停</span></div>
        <div class="rising-viewport"><div class="rising-track">${half}${half}</div></div>
    </div>`;
}

function renderHealth(health, trendHistory) {
    if (!health) return '';
    const history = (trendHistory || {}).health_history || [];
    return `<section class="status-section glass">
        <div class="section-header">
            <div>
                <div class="section-title">抓取健康</div>
                <div class="section-subtitle">平台状态、错误与最近快照的健康变化</div>
            </div>
        </div>
        <div class="health-grid">
            <div class="health-card">
                <span class="health-label">健康平台</span>
                <strong class="health-value">${health.healthy_count || 0}/${health.enabled_count || 0}</strong>
            </div>
            <div class="health-card warning">
                <span class="health-label">异常平台</span>
                <strong class="health-value">${health.failing_count || 0}</strong>
            </div>
            <div class="health-card">
                <span class="health-label">缓存过旧</span>
                <strong class="health-value">${health.stale_count || 0}</strong>
            </div>
        </div>
        ${history.length ? `<div class="health-history">${history.map(item => `
            <div class="health-history-item">
                <span class="history-time">${escapeHtml((item.id || '').slice(5).replace(/-/g, '/'))}</span>
                <div class="history-health"><strong>${item.healthy_count || 0}</strong><em>${item.failing_count || 0}</em></div>
            </div>`).join('')}</div>` : ''}
    </section>`;
}

function renderPlatformTrends(trendHistory) {
    const trends = (trendHistory || {}).platform_trends || [];
    if (!trends.length) return '';
    return `<section class="trend-section glass">
        <div class="section-header">
            <div>
                <div class="section-title">平台趋势</div>
                <div class="section-subtitle">最近快照的可用率、响应耗时与当前错误</div>
            </div>
        </div>
        <div class="platform-trend-list">${trends.map(item => `
            <article class="platform-trend-card state-${escapeHtml(item.state || 'healthy')}">
                <div class="platform-trend-head">
                    <div class="platform-name">${escapeHtml(item.name || item.platform)}</div>
                    <span class="status-pill status-${escapeHtml(item.state || 'healthy')}">${stateLabel(item.state)}</span>
                </div>
                <div class="platform-metrics">
                    <span class="metric-pill">可用率 ${Math.round((item.availability_rate || 0) * 100)}%</span>
                    ${item.current_duration_ms != null ? `<span class="metric-pill">当前 ${item.current_duration_ms}ms</span>` : ''}
                    ${item.avg_duration_ms != null ? `<span class="metric-pill">均值 ${item.avg_duration_ms}ms</span>` : ''}
                </div>
                <div class="sparkline">${(item.sparkline || []).map(state => `<span class="spark ${escapeHtml(state)}"></span>`).join('')}</div>
                <div class="platform-error">${escapeHtml(item.last_error || '最近无错误')}</div>
            </article>`).join('')}
        </div>
    </section>`;
}

/* 数据健康诊断:健康 + 平台趋势合并为一个默认折叠的区块 */
function renderDiagnostics(health, trendHistory) {
    const h = health || {};
    const failing = h.failing_count || 0;
    const stale = h.stale_count || 0;
    const dotClass = failing > 0 ? 'bad' : (stale > 0 ? 'warn' : 'good');
    const dotLabel = failing > 0 ? '有异常' : (stale > 0 ? '有过期' : '全部正常');
    const inner = renderHealth(health, trendHistory) + renderPlatformTrends(trendHistory);
    return `<section class="diag-section glass">
        <button class="diag-header" onclick="toggleDiag(this)" aria-expanded="false">
            <span class="diag-title"><span class="diag-dot ${dotClass}"></span>数据健康</span>
            <span class="diag-summary">${h.healthy_count || 0}/${h.enabled_count || 0} 正常 · ${failing} 异常 · ${stale} 过旧 · ${dotLabel}</span>
            <span class="diag-chev">▾</span>
        </button>
        <div class="diag-body">${inner}</div>
    </section>`;
}

function toggleDiag(btn) {
    const section = btn.closest('.diag-section');
    if (!section) return;
    const open = section.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}

function renderBoard(board) {
    const status = (((currentData || {}).statuses || {})[board.platform]) || {};
    const time = board.updated_at ? board.updated_at.substring(11, 19) : '';
    const isHidden = hiddenPlatforms.includes(board.platform);
    const items = board.items || [];
    const featured = items[0];
    const itemsHtml = items.map((item, idx) => {
        const topClass = item.rank <= 3 ? ` top-${item.rank}` : '';
        const extraClass = idx >= VISIBLE_COUNT ? ' is-extra' : '';
        const hotHtml = item.hot_value ? `<span class="item-hot">${escapeHtml(item.hot_value)}</span>` : '';
        return `<li class="hot-item${topClass}${extraClass}" data-title="${escapeHtml(item.title).toLowerCase()}">
            <span class="item-rank">${item.rank}</span>
            ${trendHtml(item)}
            <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener" class="item-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</a>
            ${hotHtml}
        </li>`;
    }).join('');
    const overflowCount = items.length - VISIBLE_COUNT;
    const toggleHtml = overflowCount > 0
        ? `<button class="list-toggle" onclick="toggleList(this)"><span class="lt-label">展开其余 ${overflowCount} 条</span><span class="chev">▾</span></button>`
        : '';
    const state = status.state || 'healthy';
    const toolbar = [
        `<span class="toolbar-pill">${(board.items || []).length} 条</span>`,
        status.last_duration_ms != null ? `<span class="toolbar-pill">${status.last_duration_ms}ms</span>` : '',
        status.last_item_count ? `<span class="toolbar-pill">${status.last_item_count} 条抓取</span>` : '',
    ].filter(Boolean).join('');
    const cover = featured && board.platform === 'github' ? `<div class="card-cover card-cover-github">
        <div class="cover-kicker">Featured Signal</div>
        <div class="cover-github-grid">
            <div class="cover-github-main">
                <a href="${escapeHtml(featured.url)}" target="_blank" rel="noopener" class="cover-title" title="${escapeHtml(featured.title)}">${escapeHtml(featured.title)}</a>
                <div class="cover-meta-row">
                    ${featured.hot_value ? `<span class="cover-pill">${escapeHtml(featured.hot_value)}</span>` : ''}
                    <span class="cover-pill">TOP ${featured.rank}</span>
                    <span class="cover-pill">Repo Cover</span>
                </div>
                ${featured.category ? `<p class="cover-summary">${escapeHtml(featured.category)}</p>` : ''}
            </div>
            <div class="cover-rail">${(board.items || []).slice(1, 4).map(item => `
                <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener" class="cover-rail-item" title="${escapeHtml(item.title)}">
                    <span class="cover-rail-rank">#${item.rank}</span>
                    <span class="cover-rail-title">${escapeHtml(item.title)}</span>
                </a>
            `).join('')}</div>
        </div>
    </div>` : featured ? `<div class="card-cover">
        <div class="cover-kicker">Featured Signal</div>
        <a href="${escapeHtml(featured.url)}" target="_blank" rel="noopener" class="cover-title" title="${escapeHtml(featured.title)}">${escapeHtml(featured.title)}</a>
        <div class="cover-meta-row">
            ${featured.hot_value ? `<span class="cover-pill">${escapeHtml(featured.hot_value)}</span>` : ''}
            <span class="cover-pill">TOP ${featured.rank}</span>
            <span class="cover-pill">${escapeHtml(board.platform_name || '')}</span>
        </div>
        ${featured.category ? `<p class="cover-summary">${escapeHtml(featured.category)}</p>` : ''}
    </div>` : '';

    return `<div class="board-card${isHidden ? ' hidden-platform' : ''}" data-platform="${board.platform}" data-group="${escapeHtml(board.group || '')}" data-state="${escapeHtml(state)}" style="--card-index:${board.platform_name ? board.platform_name.length : 0}">
        <div class="card-header">
            <span class="card-icon">${board.icon}</span>
            <span class="card-title">${escapeHtml(board.platform_name)}</span>
            <a href="${escapeHtml(board.source_url)}" target="_blank" rel="noopener" class="card-link">&#x2197;</a>
        </div>
        <div class="card-meta"><span class="status-pill status-${escapeHtml(state)}">${stateLabel(state)}</span><span class="time">更新于 ${time}</span></div>
        <div class="card-toolbar">${toolbar}</div>
        ${cover}
        <ul class="hot-list">${itemsHtml}</ul>
        ${toggleHtml}
        ${status.last_error ? `<div class="card-alert">${escapeHtml(status.last_error)}</div>` : ''}
    </div>`;
}

function renderData(data) {
    currentData = data;
    const main = document.getElementById('main-content');
    const timeEl = document.getElementById('update-time');

    if (data.generated_at) {
        timeEl.textContent = data.generated_at.substring(0, 19).replace('T', ' ');
    }

    let html = '';
    html += renderHero(data.health, data.analysis);
    html += renderRising(data.rising_topics);
    html += renderDiagnostics(data.health, data.trend_history);

    const grouped = data.grouped || {};
    for (const [gk, group] of Object.entries(grouped)) {
        const boardsHtml = (group.boards || []).map(renderBoard).join('');
        html += `<section class="group-section">
            <h2 class="group-title" onclick="toggleGroup(this)">${escapeHtml(group.name)}<span class="chev">▾</span></h2>
            <div class="boards-grid">${boardsHtml}</div>
        </section>`;
    }

    main.innerHTML = html || '<div class="loading-state"><h2>暂无数据</h2></div>';
    renderFilterPanel(data);
    initBoardCardEffects();
    animateHeatBars();
}

/* 触发热度条与入场后的宽度动画 */
function animateHeatBars() {
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            document.querySelectorAll('.heat-bar-fill').forEach(el => {
                el.style.width = (el.getAttribute('data-heat') || 0) + '%';
            });
        });
    });
}

/* 展开/收起单张卡片的完整榜单 */
function toggleList(btn) {
    const card = btn.closest('.board-card');
    if (!card) return;
    const expanded = card.classList.toggle('expanded');
    const extra = card.querySelectorAll('.hot-item.is-extra').length;
    btn.querySelector('.lt-label').textContent = expanded ? '收起榜单' : `展开其余 ${extra} 条`;
}

function initBoardCardEffects() {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    const cards = Array.from(document.querySelectorAll('.board-card'));

    cards.forEach((card, index) => {
        card.style.setProperty('--card-index', String(index));
        if (!canHover || reduceMotion) return;

        card.onpointermove = (event) => {
            const rect = card.getBoundingClientRect();
            const px = (event.clientX - rect.left) / rect.width;
            const py = (event.clientY - rect.top) / rect.height;
            card.style.setProperty('--pointer-x', `${(px * 100).toFixed(2)}%`);
            card.style.setProperty('--pointer-y', `${(py * 100).toFixed(2)}%`);
            card.style.setProperty('--tilt-x', `${((0.5 - py) * 6).toFixed(2)}deg`);
            card.style.setProperty('--tilt-y', `${((px - 0.5) * 7).toFixed(2)}deg`);
        };

        card.onpointerleave = () => {
            card.style.removeProperty('--pointer-x');
            card.style.removeProperty('--pointer-y');
            card.style.removeProperty('--tilt-x');
            card.style.removeProperty('--tilt-y');
        };
    });
}

function renderFilterPanel(data) {
    const panel = document.getElementById('filter-panel-body');
    if (!panel) return;
    const boards = data.boards || {};
    const platforms = Object.entries(boards).map(([k, v]) => ({
        id: k,
        name: v.platform_name || k,
        icon: v.icon || '',
    }));

    panel.innerHTML = `<h3>平台筛选（点击切换显示/隐藏）</h3>
        <div class="platform-toggles">${platforms.map(p =>
            `<span class="platform-toggle${hiddenPlatforms.includes(p.id) ? ' hidden' : ''}" data-platform="${p.id}" onclick="togglePlatform('${p.id}', this)">${p.icon} ${escapeHtml(p.name)}</span>`
        ).join('')}</div>`;
}

async function loadData(url) {
    const main = document.getElementById('main-content');
    main.innerHTML = '<div class="loading-state"><h2>Loading...</h2></div>';
    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const payload = await res.json();
        if ((!payload.statuses || !payload.health) && url.endsWith('/boards.json')) {
            try {
                const statusRes = await fetch('./api/status.json');
                if (statusRes.ok) {
                    const statusPayload = await statusRes.json();
                    payload.statuses = payload.statuses || statusPayload.statuses;
                    payload.health = payload.health || statusPayload.health;
                    payload.trend_history = payload.trend_history || statusPayload.trend_history;
                }
            } catch (e) {}
        }
        renderData(payload);
    } catch (e) {
        main.innerHTML = `<div class="error-state"><h2>加载失败</h2><p>${escapeHtml(e.message)}</p></div>`;
    }
}

async function loadHistory() {
    try {
        const res = await fetch('./api/history.json');
        if (!res.ok) return;
        const history = await res.json();
        const select = document.getElementById('history-select');
        history.sort((a, b) => b.id.localeCompare(a.id));
        // 按天聚合:同一天只保留 id 最大(最新)的一条
        const byDay = new Map();
        for (const item of history) {
            const day = (item.id || '').slice(0, 10);
            if (!byDay.has(day)) byDay.set(day, item); // 已按新→旧排序,首个即当天最新
        }
        // 仅保留最近 MAX_HISTORY_DAYS 天,避免下拉过长
        const MAX_HISTORY_DAYS = 14;
        const daily = Array.from(byDay.values()).slice(0, MAX_HISTORY_DAYS);
        for (const item of daily) {
            const opt = document.createElement('option');
            opt.value = item.file;
            const p = item.id.split('-');
            const summary = item.failing_count ? ` · 异常${item.failing_count}` : '';
            opt.textContent = `${p[1]}/${p[2]} ${p[3]}时${summary}`;
            select.appendChild(opt);
        }
    } catch (e) {}
}

function onHistoryChange(v) { loadData(v ? './api/' + v : './api/boards.json'); }

function onSearch(query) {
    const q = query.toLowerCase().trim();
    document.querySelectorAll('.hot-item').forEach(el => {
        const title = el.getAttribute('data-title') || '';
        el.classList.toggle('search-hidden', q && !title.includes(q));
    });
}

function toggleFilterPanel() {
    document.getElementById('filter-panel').classList.toggle('show');
}

function togglePlatform(platform, el) {
    const idx = hiddenPlatforms.indexOf(platform);
    if (idx >= 0) { hiddenPlatforms.splice(idx, 1); } else { hiddenPlatforms.push(platform); }
    localStorage.setItem('hb_hidden', JSON.stringify(hiddenPlatforms));
    el.classList.toggle('hidden');
    document.querySelectorAll(`.board-card[data-platform="${platform}"]`).forEach(c => c.classList.toggle('hidden-platform'));
}

function toggleGroup(el) {
    el.classList.toggle('collapsed');
    const grid = el.nextElementSibling;
    if (grid) grid.classList.toggle('collapsed');
}

// Init
loadData('./api/boards.json');
loadHistory();

// URL params
const params = new URLSearchParams(location.search);
if (params.get('q')) {
    document.getElementById('search-input').value = params.get('q');
    setTimeout(() => onSearch(params.get('q')), 500);
}
</script>
